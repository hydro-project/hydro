[package]
name = "cress"
publish = false
version = "0.1.0"
description = "Cress, the schedule-amplification checker for Hydro programs: finds work a program does in response to delay alone."
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[features]
stageleft_macro_entrypoint = ["hydro_lang/stageleft_macro_entrypoint"]

[lints]
workspace = true

[dependencies]
bincode = "1.3.1"
cress_config_macro = { path = "../cress_config_macro", version = "^0.1.0" }
hydro_lang = { path = "../hydro_lang", version = "=0.17.0-alpha.6", default-features = false, features = ["sim"] }
quote = "1.0.35"
serde = { version = "1.0.197", features = ["derive"] }
stageleft.workspace = true
syn = { version = "2.0.46", features = [ "parsing", "extra-traits" ] }

[build-dependencies]
stageleft_tool.workspace = true
