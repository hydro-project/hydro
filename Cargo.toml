[workspace]

# See "Adding new crates" and "Moving crates" addendum sections in `RELEASING.md`
members = [
    "benches",
    "copy_span",
    "dfir_lang",
    "dfir_macro",
    "dfir_rs",
    "dfir_pipes",
    "example_test",
    "hydro_build_utils",
    "hydro_concurrent_cargo",
    "hydro_deploy/core",
    "hydro_deploy/hydro_deploy_integration",
    "hydro_lang",
    "hydro_std",
    "hydro_test",
    "hydro_test_embedded",
    "hydro_test_template",
    "hydro_verus_tests",
    "include_mdtests",
    "lattices_macro",
    "lattices",
    "multiplatform_test",
    "sinktools",
    "variadics_macro",
    "variadics",
    "website_playground",
]
exclude = ["template"]

resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hydro-project/hydro"

[profile.release]
strip = true      # Strip symbols from the binary
# Previously this was "z" to minimize docker binary size while sacrificing performance. But "z"
# doesn't make things that much smaller, `strip` is far more important for binary size. Use "3" for
# performance.
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.profile]
inherits = "release"
debug = 2
lto = "off"
strip = "none"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.website_playground]
debug-assertions = false

[profile.release.package.website_playground]
opt-level = "s"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
impl_trait_overcaptures = "warn"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_qualifications = "warn"
# `verus_keep_ghost` is set by the Verus driver (`cargo verus verify`); it gates the
# proof obligations generated by `hydro_lang::properties::verus_proof_commutative_*`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
# dbg_macro = "warn" # TODO: enable to prevent stray `dbg!(...)` calls from being committed
doc_link_with_quotes = "warn"
doc_markdown = "warn"
equatable_if_let = "warn"
expl_impl_clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
format_collect = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
let_and_return = "allow"
macro_use_imports = "warn"
manual_assert = "warn"
# manual_assert_eq = "warn" # TODO: requires clippy 1.97.0
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
match_bool = "warn"
mismatching_type_param_order = "warn"
must_use_candidate = "warn"
mut_mut = "warn"
# needless_pass_by_value = "warn" # TODO(mingwei): causes many breaking changes
needless_raw_string_hashes = "warn"
nonminimal_bool = "warn"
option_as_ref_cloned = "warn"
or_fun_call = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
range_minus_one = "warn"
redundant_clone = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
ref_option = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
str_split_at_newline = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_to_string = "warn"
trait_duplication_in_bounds = "warn"
transmute_ptr_to_ptr = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
# undocumented_unsafe_blocks = "warn" # TODO: add `// SAFETY:` comments to existing unsafe blocks
unnecessary_join = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_peekable = "warn"

[workspace.dependencies]
stageleft = "0.16.0"
stageleft_tool = "0.16.0"
