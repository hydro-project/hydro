name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
  # The `merge_group` event has no pull request info, so there's nothing to validate here. We still
  # need the job to run (and pass) so the required check gets reported on the merge group. The PR
  # title was already validated on the `pull_request` event, which must pass before the PR can be
  # added to the merge queue.
  merge_group:

permissions:
  pull-requests: read

jobs:
  main:
    name: Conventional Commits
    runs-on: ubuntu-slim
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            governance
