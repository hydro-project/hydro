[profile.default]
slow-timeout = { terminate-after = 10 } # terminate after 10 intervals of (default: `period = "60s"`).
default-filter = "not (package(hydro_test) & kind(bench))"

[test-groups]
serial-integration = { max-threads = 1 }
serial-cargo = { max-threads = 1 }
serial-sim-fuzzer = { max-threads = 1 }

# Tests that spawn `cargo` each build in a target dir of their own (`target/tests/trybuild` for
# the trybuild compile-fail tests, `target/sim` for `cargo sim`), so they never block the rest of
# the suite, which only holds the shared target dir's lock. They would, however, queue on each
# other's build lock within one target dir, so each family is serialized among itself. Each is a
# cold build of its crate's dependency tree (`cargo sim` additionally compiles `hydro_lang` with
# fuzzing instrumentation at opt-level=3), now sharing the machine with the rest of the suite.
[[profile.default.overrides]]
filter = 'binary(compile_fail) | binary(surface_compile_fail) | binary(embedded_compile_fail)'
test-group = 'serial-cargo'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'binary(sim_fuzzer)'
test-group = 'serial-sim-fuzzer'
slow-timeout = { period = "60s", terminate-after = 20 }

# TODO(inline): deadlock_detector disabled (intra-tick cycles)
# [[profile.default.overrides]]
# filter = 'binary(deadlock_detector)'
# test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(two_pc_hf)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(kvs)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(kvs_replicated)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(echo_local)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'test(test_distributed_echo_example_docker)'
threads-required = 'num-test-threads'
