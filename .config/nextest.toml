[profile.default]
slow-timeout = { terminate-after = 10 } # terminate after 10 intervals of (default: `period = "60s"`).
default-filter = "not (package(hydro_test) & kind(bench))"

# Tests that invoke `cargo` internally (trybuild compile-fail tests, the `cargo sim` fuzzer,
# Maelstrom deployments) recompile many dependencies, so CI runs them on a separate machine.
# The Maelstrom tests build via `hydro_concurrent_cargo` (like the simulator) and run concurrently;
# the rest run serially, see `serial-cargo` below.
[profile.ci-heavy]
default-filter = "not (package(hydro_test) & kind(bench)) & (binary(compile_fail) | binary(surface_compile_fail) | binary(sim_fuzzer) | binary(rustflags_propagation) | (package(hydro_test) & test(maelstrom::)))"

[profile.ci-main]
default-filter = "not (package(hydro_test) & kind(bench)) & not (binary(compile_fail) | binary(surface_compile_fail) | binary(sim_fuzzer) | binary(rustflags_propagation) | (package(hydro_test) & test(maelstrom::)))"

[test-groups]
serial-integration = { max-threads = 1 }
serial-cargo = { max-threads = 1 }

# Tests that run `cargo` directly in the shared target directory contend on its build lock.
[[profile.default.overrides]]
filter = 'binary(compile_fail) | binary(surface_compile_fail) | binary(sim_fuzzer) | binary(rustflags_propagation)'
test-group = 'serial-cargo'

# TODO(inline): deadlock_detector disabled (intra-tick cycles)
# [[profile.default.overrides]]
# filter = 'binary(deadlock_detector)'
# test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(two_pc_hf)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(kvs)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(kvs_replicated)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'binary(echo_local)'
test-group = 'serial-integration'

# `cargo sim` rebuilds `hydro_lang` and its dependencies with fuzzing instrumentation at
# opt-level=3, which takes close to 10 minutes on macOS CI runners.
[[profile.default.overrides]]
filter = 'test(fuzz_with_cargo_sim)'
threads-required = 'num-test-threads'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'test(test_distributed_echo_example_docker)'
threads-required = 'num-test-threads'
