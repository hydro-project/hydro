[package]
name = "cress_config_macro"
publish = false
version = "0.1.0"
description = "Attribute and derive macros that generate a Cress amplification-check harness from a Hydro function's signature."
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.35"
syn = { version = "2.0.46", features = [ "full", "parsing", "extra-traits", "visit-mut" ] }
