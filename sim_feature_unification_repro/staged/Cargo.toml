[package]
name = "sim_repro_staged"
publish = false
version = "0.0.0"
edition = "2024"

[dependencies]
hydro_lang = { path = "../../hydro_lang" }
stageleft = "0.15.1"

[build-dependencies]
stageleft_tool = "0.15.1"

[dev-dependencies]
hydro_lang = { path = "../../hydro_lang", features = ["sim"] }

# NOTE: deliberately *no* `tokio = { features = ["full"] }` dev-dependency here.
# `hydro_test` (and the project template) carry that dev-dependency, which is
# copied into the generated trybuild manifest and happens to mask the bug this
# crate reproduces. The whole point of this repro is that a *sibling* crate
# (../sibling) enables tokio features that unify into the HOST test binary but
# never reach the generated sim dylib's manifest.
